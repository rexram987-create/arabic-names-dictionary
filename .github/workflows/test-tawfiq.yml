name: Test Tawfiq pronunciation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-tawfiq.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote approved Tawfiq recording
        run: cp audio/tawfiq-test3.mp3 audio/tawfiq.mp3
      - name: Commit test audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/tawfiq.mp3
          git commit -m "Replace Tawfiq with approved pronunciation"
          git push
