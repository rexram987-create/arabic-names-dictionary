name: Generate Arabic name audio

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of new recordings to generate"
        required: true
        default: "10"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate missing MP3 files with Yasmin
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TTS_LIMIT: ${{ inputs.limit }}
        run: node scripts/generate-audio.js

      - name: Commit generated recordings
        run: |
          if git diff --quiet -- audio; then
            echo "No new recordings to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          git commit -m "Generate Arabic name pronunciations with Yasmin"
          git push
