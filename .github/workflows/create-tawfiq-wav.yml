name: Create Tawfiq WAV

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/create-tawfiq-wav.yml"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Create Android-friendly WAV
        run: |
          ffmpeg -y -i audio/tawfiq.mp3 -ar 44100 -ac 1 -c:a pcm_s16le audio/tawfiq.wav
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels -of default=nw=1 audio/tawfiq.wav
      - name: Commit WAV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/tawfiq.wav
          git commit -m "Add WAV fallback for Tawfiq pronunciation"
          git push
